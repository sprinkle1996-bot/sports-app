<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sports" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Sports</title>
  <link id="favicon-link" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%231b5e20'/%3E%3Crect x='0' y='0' width='180' height='26' fill='%23144518'/%3E%3Crect x='0' y='154' width='180' height='26' fill='%23144518'/%3E%3Crect x='0' y='48' width='180' height='22' fill='%23216e27'/%3E%3Crect x='0' y='92' width='180' height='22' fill='%23216e27'/%3E%3Crect x='0' y='136' width='180' height='18' fill='%23216e27'/%3E%3Cg stroke='%23ffffff' stroke-width='3' opacity='0.85'%3E%3Cline x1='14' y1='26' x2='166' y2='26'/%3E%3Cline x1='14' y1='58' x2='166' y2='58'/%3E%3Cline x1='14' y1='90' x2='166' y2='90' stroke-width='4'/%3E%3Cline x1='14' y1='122' x2='166' y2='122'/%3E%3Cline x1='14' y1='154' x2='166' y2='154'/%3E%3Crect x='14' y='14' width='152' height='152' rx='8' fill='none' stroke-width='4'/%3E%3C/g%3E%3Cellipse cx='90' cy='90' rx='24' ry='14' fill='%237a3b14' stroke='%23ffffff' stroke-width='3'/%3E%3Cline x1='80' y1='90' x2='100' y2='90' stroke='%23ffffff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link id="apple-icon-link" rel="apple-touch-icon" sizes="180x180" href="" />
  <style>
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --surface-2: #2c2c2e;
      --border: rgba(255, 255, 255, 0.09);
      --text: #ffffff;
      --text-sec: #8e8e93;
      --text-dim: #636366;
      --accent: #0a84ff;
      --gold: #ffd60a;
      --live: #ff453a;
      --green: #30d158;
      --reddit: #ff5700;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0 0 40px;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell { max-width: 680px; margin: 0 auto; }

    /* Frosted Sticky Header */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-bottom: 1px solid var(--border);
      padding: max(14px, env(safe-area-inset-top)) 16px 12px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
    .header-actions { display: flex; gap: 8px; }

    .icon-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .icon-btn.active { background: var(--text); color: #000; border-color: var(--text); }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .icon-btn.spinning { opacity: 0.6; pointer-events: none; }
    .icon-btn.spinning span { display: inline-block; animation: spin 0.7s linear infinite; }

    /* Horizontal League Pills */
    .controls {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .controls::-webkit-scrollbar { display: none; }

    .league-btn {
      background: var(--surface);
      color: #d1d1d6;
      border: 1px solid transparent;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
    }
    .league-btn.active { background: var(--text); color: #000000; }
    .league-btn.my-teams-btn { color: var(--gold); border-color: rgba(255, 214, 10, 0.3); }
    .league-btn.my-teams-btn.active { background: var(--gold); color: #000000; border-color: var(--gold); }

    .main { padding: 14px 16px 0; }

    /* Search Bar */
    .search-wrap { position: relative; margin-bottom: 12px; }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sec);
      font-size: 0.85rem;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 34px 9px 34px;
      font-size: 0.9rem;
      outline: none;
    }
    .search-input::placeholder { color: var(--text-sec); }
    .search-input:focus { border-color: rgba(10, 132, 255, 0.65); }
    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--surface-2);
      color: var(--text-sec);
      border: none;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      font-size: 0.85rem;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .search-clear.visible { display: flex; }

    /* Segmented Controls */
    .segmented-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface);
      padding: 3px;
      border-radius: 10px;
      flex: 1;
    }
    .segmented.three-col { grid-template-columns: repeat(3, 1fr); }
    .segmented button {
      background: transparent;
      color: var(--text-sec);
      border: none;
      padding: 7px 8px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }
    .segmented button.active {
      background: #3a3a3c;
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }

    /* Date Switcher Bar */
    .date-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
    .date-bar.hidden { display: none; }
    .date-segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--surface);
      padding: 3px;
      border-radius: 10px;
      flex: 1;
    }
    .date-segmented button {
      background: transparent;
      color: var(--text-sec);
      border: none;
      padding: 6px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .date-segmented button.active { background: #3a3a3c; color: var(--text); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4); }
    .custom-date-wrap { position: relative; display: flex; align-items: center; }
    .custom-date-btn {
      background: var(--surface);
      color: var(--text-sec);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .custom-date-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .custom-date-input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; color-scheme: dark; }

    /* Live / Final Status Filter Bar */
    .status-filter { margin-bottom: 12px; }
    .status-filter.hidden { display: none; }
    .status-filter .live-dot { color: var(--live); }

    .college-filter { display: none; margin-bottom: 14px; }
    .college-filter.visible { display: block; }

    /* Favorites Drawer */
    .fav-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .fav-panel.open { display: block; }
    .fav-panel-title { font-size: 0.8rem; color: var(--text-sec); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }
    .fav-form { display: flex; gap: 8px; margin-bottom: 10px; }
    .fav-form select, .fav-form input {
      background: #000;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 0.88rem;
    }
    .fav-form input { flex: 1; min-width: 0; }
    .fav-form button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 14px;
      font-weight: 600;
      font-size: 0.86rem;
      cursor: pointer;
    }
    .fav-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .fav-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 214, 10, 0.12);
      border: 1px solid rgba(255, 214, 10, 0.35);
      color: var(--gold);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .fav-chip-league { font-size: 0.68rem; color: var(--text-sec); }
    .fav-chip button { background: transparent; border: none; color: var(--gold); padding: 0 2px; font-size: 1rem; line-height: 1; cursor: pointer; }

    /* Cards */
    .game-card, .news-card, .standings-card {
      background: var(--surface);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .game-card.clickable { cursor: pointer; }
    .game-card.pinned { border-color: rgba(255, 214, 10, 0.45); }

    .status-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
    .status-left { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .league-pill, .source-pill {
      background: var(--surface-2);
      color: #e5e5ea;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }
    .source-pill { background: rgba(10, 132, 255, 0.18); color: #64d2ff; }
    .status { font-size: 0.78rem; color: var(--text-sec); font-weight: 600; }
    .status.live { color: var(--live); }
    .pinned-badge { font-size: 0.7rem; font-weight: 700; color: var(--gold); flex-shrink: 0; }

    .event-title { font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 4px; }
    .team-row, .leader-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; gap: 8px; }
    .leader-row { border-top: 1px solid var(--border); font-size: 0.9rem; padding: 8px 0; }
    .leader-row:first-of-type { border-top: none; }
    .leader-row.pinned-leader { background: rgba(255, 214, 10, 0.08); margin-inline: -8px; padding-inline: 8px; border-radius: 8px; }
    .team-info { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; }
    .team-info img { width: 26px; height: 26px; object-fit: contain; flex-shrink: 0; }
    .team-name { font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .poss-ball { font-size: 0.82rem; line-height: 1; flex-shrink: 0; }
    .team-row.loser .team-name, .team-row.loser .score { color: var(--text-sec); }
    .rank { font-size: 0.76rem; color: var(--text-sec); font-weight: 700; min-width: 16px; font-variant-numeric: tabular-nums; }
    .record { font-size: 0.76rem; color: var(--text-dim); font-weight: 500; flex-shrink: 0; }
    .score { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; padding-left: 8px; }
    .pos { font-weight: 700; color: var(--text-sec); width: 28px; display: inline-block; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .star-btn { background: transparent; border: none; padding: 2px; font-size: 1rem; line-height: 1; color: #48484a; cursor: pointer; }
    .star-btn.starred { color: var(--gold); }

    /* Betting Odds Strip */
    .odds-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      font-size: 0.74rem;
      font-weight: 600;
      color: #d1d1d6;
      font-variant-numeric: tabular-nums;
      flex-wrap: wrap;
    }
    .odds-label { color: var(--green); font-size: 0.66rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; }
    .odds-sep { color: var(--text-dim); }

    /* Card Footer */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .watch-list { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .watch-pill, .reddit-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      text-decoration: none;
      background: var(--surface-2);
      color: #e5e5ea;
    }
    .watch-pill.yttv { background: rgba(255, 69, 58, 0.16); color: #ff6961; }
    .watch-pill.stream { background: rgba(10, 132, 255, 0.18); color: #64d2ff; }
    .reddit-pill { background: rgba(255, 87, 0, 0.15); color: #ff8c52; }
    .tap-hint { font-size: 0.74rem; font-weight: 600; color: var(--text-dim); margin-left: auto; }

    /* Box Score Drawer */
    .box-drawer {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      cursor: default;
    }
    .box-drawer.open { display: block; }
    .box-subtabs {
      display: flex;
      gap: 4px;
      background: #000;
      padding: 3px;
      border-radius: 9px;
      margin-bottom: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .box-subtabs::-webkit-scrollbar { display: none; }
    .box-subtabs button {
      flex: 1;
      background: transparent;
      color: var(--text-sec);
      border: none;
      padding: 7px 6px;
      border-radius: 7px;
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .box-subtabs button.active { background: var(--surface-2); color: var(--text); }

    /* In-App Recap Reader */
    .recap-card { background: #111113; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .recap-hero { width: 100%; max-height: 210px; object-fit: cover; display: block; }
    .recap-inner { padding: 14px; }
    .recap-headline { font-size: 1.08rem; font-weight: 800; line-height: 1.3; letter-spacing: -0.01em; margin: 0 0 6px; color: #ffffff; }
    .recap-meta { font-size: 0.74rem; color: var(--text-sec); margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .recap-story { font-size: 0.88rem; line-height: 1.58; color: #e5e5ea; }
    .recap-story p { margin: 0 0 12px; }
    .recap-story p:last-child { margin-bottom: 0; }
    .recap-story h2, .recap-story h3 { font-size: 0.96rem; font-weight: 700; color: #fff; margin: 14px 0 6px; }
    .recap-story a { color: #64d2ff; text-decoration: none; }
    .recap-story ul { padding-left: 18px; margin: 0 0 12px; }

    /* Football Field Visualizer */
    .field-card { background: #111113; border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
    .field-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 0.8rem; font-weight: 700; }
    .field-poss { display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
    .field-poss-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--gold); }
    .field-situation { color: var(--gold); font-variant-numeric: tabular-nums; }
    .field-svg-wrap { width: 100%; margin: 6px 0 8px; }
    .field-svg-wrap svg { width: 100%; height: auto; display: block; border-radius: 8px; }
    .field-markers { display: flex; justify-content: space-between; padding: 0 9%; font-size: 0.7rem; font-weight: 700; color: var(--text-sec); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
    .last-play-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; line-height: 1.4; color: #e5e5ea; }
    .last-play-meta { display: flex; justify-content: space-between; font-size: 0.72rem; font-weight: 700; color: var(--text-sec); margin-bottom: 4px; }
    .drive-summary-line { margin-top: 8px; font-size: 0.74rem; color: var(--text-sec); text-align: center; font-weight: 600; }

    /* Player Stat Breakdowns */
    .player-team-toggle {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: #000;
      padding: 3px;
      border-radius: 9px;
      margin-bottom: 12px;
    }
    .player-team-toggle button {
      background: transparent;
      color: var(--text-sec);
      border: none;
      padding: 8px 6px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-team-toggle button.active { background: var(--accent); color: #fff; }
    .player-team-pane { display: none; }
    .player-team-pane.visible { display: block; }
    .player-team-heading {
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--text);
      margin: 14px 0 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .player-team-pane:first-of-type .player-team-heading { margin-top: 0; }
    .player-cat-block { margin-bottom: 14px; }
    .player-cat-block:last-child { margin-bottom: 0; }
    .player-cat-title { font-size: 0.7rem; font-weight: 800; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
    .player-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; background: #111113; border: 1px solid var(--border); border-radius: 10px; padding: 4px 8px; }
    .player-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; font-variant-numeric: tabular-nums; }
    .player-table th { color: var(--text-sec); font-size: 0.68rem; font-weight: 700; padding: 6px 5px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .player-table th:first-child { text-align: left; }
    .player-table td { padding: 7px 5px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; color: #e5e5ea; }
    .player-table tr:last-child td { border-bottom: none; }
    .player-table td:first-child { text-align: left; font-weight: 600; color: #fff; max-width: 135px; overflow: hidden; text-overflow: ellipsis; }
    .player-pos { color: var(--text-dim); font-size: 0.68rem; font-weight: 600; margin-left: 4px; }

    /* Highlights, X & YouTube Auto-Embeds */
    .x-section-title { font-size: 0.72rem; font-weight: 800; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 0 8px; }
    .x-section-title:first-child { margin-top: 0; }
    .x-btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .x-action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #111113;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .x-action-btn.x-primary { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.22); }
    .x-action-btn.yt-btn { grid-column: 1 / -1; background: rgba(255, 69, 58, 0.14); border-color: rgba(255, 69, 58, 0.35); color: #ff6961; }
    .x-embed-wrap { margin-bottom: 14px; background: #111113; border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
    .x-embed-note { font-size: 0.72rem; color: var(--text-sec); margin: 6px 0 0; text-align: center; }
    .video-card { background: #111113; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
    .video-card video { width: 100%; max-height: 220px; display: block; background: #000; }
    .video-title { padding: 8px 10px; font-size: 0.8rem; font-weight: 600; color: #e5e5ea; line-height: 1.3; }

    .yt-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      cursor: pointer;
      overflow: hidden;
    }
    .yt-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.88; }
    .yt-play-btn {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 52px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 0, 0, 0.88);
      color: #fff;
      font-size: 1.1rem;

    function renderRedditPills(leaguePath, awayName, homeName, eventName = "") {
      const league = leagueMap[leaguePath];
      if (!league?.subreddit) return "";
      const sub = league.subreddit;
      const base = `https://www.reddit.com/r/${sub}/search/?restrict_sr=1&sort=new&t=week&q=`;

      let liveLabel = "Game Thread";
      let postLabel = "Post Game";
      let liveQuery = "";
      let postQuery = "";

      if (leaguePath.startsWith("soccer/")) {
        liveLabel = "Match Thread"; postLabel = "Post-Match";
        liveQuery = `Match Thread ${awayName} ${homeName}`;
        postQuery = `Post Match Thread ${awayName} ${homeName}`;

        postQuery = `Post Game Thread ${awayName} ${homeName}`;
      }

      return `
        <a class="reddit-pill" href="${base}${encodeURIComponent(liveQuery)}" target="_blank" rel="noopener noreferrer">💬 ${liveLabel}</a>
        <a class="reddit-pill" href="${base}${encodeURIComponent(postQuery)}" target="_blank" rel="noopener noreferrer">💬 ${postLabel}</a>

    const YTTV_CHANNELS = [
      "abc", "cbs", "nbc", "fox", "cw", "the cw",

      "fs1", "fs2", "tnt", "tbs", "trutv", "usa", "usa net", "cnbc",

      { match: ["espn+", "espn plus", "secn+", "accnx"], url: "https://www.espn.com/watch/" },

      { match: ["hulu"], url: "https://www.hulu.com/hub/sports" },
      { match: ["roku"], url: "https://therokuchannel.roku.com/" }
    ];

    function resolveWatchLink(channelName) {
      const clean = (channelName || "").trim();
      const lower = clean.toLowerCase();
      if (!clean) return null;

      for (const app of STREAMING_APPS) {
        if (app.match.some(m => lower.includes(m))) {
          return { channel: clean, url: app.url, type: "stream", text: `▶ ${clean}` };
        }
      }

      if (YTTV_CHANNELS.some(ch => lower === ch || lower.startsWith(ch + " "))) {
        return { channel: clean, url: "https://tv.youtube.com/live", type: "yttv", text: `▶ ${clean} · YTTV` };
      }

      return { channel: clean, url: null, type: "other", text: clean };
    }

    function extractBroadcasts(comp) {
      const names = new Set();
      (comp?.broadcasts || []).forEach(b => (b.names || []).forEach(n => names.add(n)));
      (comp?.geoBroadcasts || []).forEach(gb => {
        if (gb.media?.shortName) names.add(gb.media.shortName);
      });
      return Array.from(names).map(resolveWatchLink).filter(Boolean);
    }

    function renderWatchPills(comp) {
      const links = extractBroadcasts(comp);
      if (links.length === 0) return "";
      return links.slice(0, 3).map(item => {
        if (!item.url) return `<span class="watch-pill">${escapeHtml(item.text)}</span>`;
        return `<a class="watch-pill ${item.type}" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.text)}</a>`;
      }).join("");
    }

    function formatMoneyline(val) {
      if (val === undefined || val === null || val === "") return "";
      const num = Number(val);
      if (Number.isNaN(num)) return String(val);
      return num > 0 ? `+${num}` : `${num}`;
    }

    function renderOddsStrip(comp, state, away, home) {
      if (state === "post") return "";
      const odds = comp?.odds?.[0];
      if (!odds) return "";

      const parts = [];
      if (odds.details && odds.details !== "EVEN") parts.push(odds.details);
      else if (odds.details === "EVEN") parts.push("PK");

      if (odds.overUnder !== undefined && odds.overUnder !== null) {
        parts.push(`O/U ${odds.overUnder}`);
      }

      const awayML = formatMoneyline(odds.awayTeamOdds?.moneyLine);
      const homeML = formatMoneyline(odds.homeTeamOdds?.moneyLine);
      if (awayML && homeML) {
        const awayAbbr = away?.team?.abbreviation || "Away";
        const homeAbbr = home?.team?.abbreviation || "Home";
        parts.push(`ML ${awayAbbr} ${awayML} / ${homeAbbr} ${homeML}`);
      }

      if (parts.length === 0) return "";
      return `
        <div class="odds-strip">
          <span class="odds-label">Odds</span>
          <span>${parts.map(escapeHtml).join(' <span class="odds-sep">·</span> ')}</span>
        </div>
      `;
    }

    /* ---------- X (TWITTER) WIDGET LOADER ---------- */
    let xWidgetLoaded = false;
    function ensureXWidgetScript(container) {
      if (window.twttr?.widgets) {
        window.twttr.widgets.load(container);
        return;
      }
      if (!xWidgetLoaded) {
        xWidgetLoaded = true;
        const s = document.createElement("script");
        s.src = "https://platform.twitter.com/widgets.js";
        s.async = true;
        s.onload = () => { if (window.twttr?.widgets) window.twttr.widgets.load(container); };
        document.body.appendChild(s);
      }
    }

    /* ---------- OFFICIAL YOUTUBE RSS AUTO-EMBEDDER ---------- */
    function extractYtVideoId(link, guid) {
      const str = `${link || ""} ${guid || ""}`;
      const match = str.match(/(?:v=|youtu\.be\/|yt:video:)([a-zA-Z0-9_-]{11})/);
      return match ? match[1] : "";
    }

    async function fetchYouTubeChannelVideos(channel) {
      if (ytChannelCache.has(channel.id)) return ytChannelCache.get(channel.id);
      const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channel.id}`;
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
      try {
        const res = await fetch(apiUrl);
        const data = await res.json();
        if (data.status !== "ok" || !Array.isArray(data.items)) return [];
        const items = data.items.map(item => {
          const videoId = extractYtVideoId(item.link, item.guid);
          return {
            videoId,
            title: stripHtml(item.title),
            channelName: channel.name,
            pubDate: item.pubDate,
            thumbnail: videoId ? `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg` : (item.thumbnail || "")
          };
        }).filter(v => v.videoId);
        ytChannelCache.set(channel.id, items);
        return items;
      } catch {
        return [];
      }
    }

    async function loadYouTubeMatchesIntoSlot(slotEl, leaguePath, teamKeywords) {
      const league = leagueMap[leaguePath];
      const channels = league?.ytChannels || [];
      if (!slotEl || channels.length === 0) return;

      const results = await Promise.allSettled(channels.map(ch => fetchYouTubeChannelVideos(ch)));
      const seen = new Set();
      const allVideos = [];
      results.forEach(r => {
        if (r.status !== "fulfilled") return;
        r.value.forEach(v => {
          if (!seen.has(v.videoId)) { seen.add(v.videoId); allVideos.push(v); }
        });
      });

      const needles = teamKeywords.map(k => k.toLowerCase().trim()).filter(k => k.length >= 3);
      const matched = allVideos.filter(v => {
        const t = v.title.toLowerCase();
        return needles.some(n => t.includes(n));
      }).slice(0, 6);

      if (matched.length === 0) {
        slotEl.innerHTML = `<div class="yt-status-note">No recent official YouTube uploads matched this matchup yet. Use the YouTube search button below.</div>`;
        return;
      }

      slotEl.innerHTML = matched.map(v => `
        <div class="video-card">
          <div class="yt-thumb-wrap" onclick="event.stopPropagation(); window.__playYouTubeEmbed(this, '${escapeHtml(v.videoId)}')">
            <img src="${escapeHtml(v.thumbnail)}" alt="" loading="lazy" />
            <div class="yt-play-btn">▶</div>
          </div>
          <div class="yt-meta-row">
            <div class="video-title" style="padding:0;">${escapeHtml(v.title)}</div>
            <span class="yt-channel-badge">${escapeHtml(v.channelName)}</span>
          </div>
        </div>
      `).join("");
    }

    window.__playYouTubeEmbed = function(thumbEl, videoId) {
      if (!thumbEl || !videoId) return;
      const wrap = document.createElement("div");
      wrap.className = "yt-iframe-wrap";
      wrap.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}?autoplay=1&rel=0&modestbranding=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      thumbEl.replaceWith(wrap);
    };

    function formatYYYYMMDD(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, "0");
      const d = String(dateObj.getDate()).padStart(2, "0");
      return `${y}${m}${d}`;
    }

    function formatShortDate(yyyyMmDd) {
      const [y, m, d] = yyyyMmDd.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    function getActiveDateParam() {
      if (dateMode === "today") return "";
      if (dateMode === "custom" && customDateStr) return customDateStr.replace(/-/g, "");
      const d = new Date();
      if (dateMode === "yesterday") d.setDate(d.getDate() - 1);
      if (dateMode === "tomorrow") d.setDate(d.getDate() + 1);
      return formatYYYYMMDD(d);
    }

    function getScoreboardUrl(league) {
      const base = `https://site.api.espn.com/apis/site/v2/sports/${league.path}/scoreboard`;
      const params = new URLSearchParams(league.queryParams || "");
      const dateParam = getActiveDateParam();
      if (dateParam) params.set("dates", dateParam);
      const qs = params.toString();
      return qs ? `${base}?${qs}` : base;
    }

      if (fav.id && id && String(fav.id) === String(id)) return true;
      const needle = (fav.name || "").trim().toLowerCase();
      if (!needle) return false;
      return names.some(n => n && n.toLowerCase().includes(needle));

      const list = getLeagueFavs(leaguePath);
      const namesToCheck = [displayName, ...allNames].filter(Boolean);
      const exists = list.some(fav => matchesFav(fav, id, namesToCheck));

      if (exists) {
        favorites[leaguePath] = list.filter(fav => !matchesFav(fav, id, namesToCheck));
      } else {
        favorites[leaguePath] = [...list, { id: id ? String(id) : null, name: displayName }];

    function formatTimeAgo(dateStr) {
      if (!dateStr) return "";
      const ts = new Date(dateStr).getTime();
      if (Number.isNaN(ts)) return "";
      const diffMins = Math.floor((Date.now() - ts) / 60000);
      if (diffMins < 60) return `${Math.max(1, diffMins)}m ago`;
      const diffHrs = Math.floor(diffMins / 60);
      if (diffHrs < 24) return `${diffHrs}h ago`;
      return `${Math.floor(diffHrs / 24)}d ago`;
    }

    function extractStandingsGroups(node, parentTitle = "", out = []) {
      if (!node) return out;
      const title = node.name || node.shortName || parentTitle;
      if (node.standings?.entries?.length) {
        out.push({ title: title || "Standings", entries: node.standings.entries });
      }
      if (Array.isArray(node.children)) {
        node.children.forEach(child => {
          const nextTitle = child.name && title && child.name !== title && !title.includes(child.name)
            ? (node.children.length > 1 && parentTitle ? `${title} · ${child.name}` : child.name)
            : (child.name || title);
          extractStandingsGroups(child, nextTitle, out);
        });
      }
      return out;
    }

    function findStatObj(stats, keys) {
      for (const k of keys) {
        const lower = k.toLowerCase();
        const found = stats.find(s =>
          (s.name && s.name.toLowerCase() === lower) ||
          (s.type && s.type.toLowerCase() === lower) ||
          (s.shortDisplayName && s.shortDisplayName.toLowerCase() === lower) ||
          (s.abbreviation && s.abbreviation.toLowerCase() === lower)
        );
        if (found) return found;
      }
      return null;
    }

    function pickStandingsColumns(entries, leaguePath) {
      const sampleStats = entries[0]?.stats || [];
      const prefs = PREFERRED_STATS[leaguePath] || [];
      const matched = [];
      prefs.forEach(col => { if (findStatObj(sampleStats, col.keys)) matched.push(col); });
      if (matched.length >= 2) return matched;

      const skip = new Set(["rank", "playoffseed", "rankchange", "clincher"]);
      return sampleStats
        .filter(s => !skip.has((s.name || "").toLowerCase()) && s.displayValue !== undefined)
        .slice(0, 4)
        .map(s => ({ keys: [s.name || s.abbreviation || s.shortDisplayName], label: s.shortDisplayName || s.abbreviation || s.name }));
    }

    function getEntryMeta(entry) {
      const entity = entry.team || entry.athlete || {};
      const id = entity.id || "";
      const name = entity.shortDisplayName || entity.displayName || entity.name || "TBD";
      const fullName = entity.displayName || entity.name || name;
      const abbr = entity.abbreviation || "";
      const logo = entity.logos?.[0]?.href || entity.flag?.href || entity.headshot?.href || "";
      return { id, name, fullName, abbr, logo };
    }

    function renderStandingsCard(group, leaguePath, showLeaguePill = false) {
      const allEntries = group.entries || [];
      if (allEntries.length === 0) return "";
      const titleMatches = matchesSearch(group.title);
      const entries = searchQuery && !titleMatches
        ? allEntries.filter(entry => {
            const m = getEntryMeta(entry);
            return matchesSearch(`${m.name} ${m.fullName} ${m.abbr}`);
          })
        : allEntries;
      if (entries.length === 0) return "";

      const cols = pickStandingsColumns(allEntries, leaguePath);
      const leagueLabel = leagueMap[leaguePath]?.label || "";

      const rowsHtml = entries.map(entry => {
        const stats = entry.stats || [];
        const meta = getEntryMeta(entry);
        const isFav = isFavorited(leaguePath, meta.id, [meta.name, meta.fullName, meta.abbr]);
        const rankStat = findStatObj(stats, ["rank", "playoffSeed"]);
        const rankDisplay = rankStat?.displayValue || (allEntries.indexOf(entry) + 1);
        const cellsHtml = cols.map(col => `<td>${escapeHtml(findStatObj(stats, col.keys)?.displayValue ?? "-")}</td>`).join("");
        return `
          <tr class="${isFav ? "pinned-row" : ""}">
            <td>
              <div class="st-team-cell">
                <span class="st-rank">${escapeHtml(rankDisplay)}</span>
                ${meta.logo ? `<img class="st-logo" src="${escapeHtml(meta.logo)}" alt="" loading="lazy" />` : ""}
                <span class="st-name">${isFav ? "★ " : ""}${escapeHtml(meta.name)}</span>
              </div>
            </td>
            ${cellsHtml}
          </tr>
        `;
      }).join("");

      return `
        <div class="standings-card">
          <div class="standings-header">
            <div class="standings-title">${escapeHtml(group.title)}</div>
            ${showLeaguePill ? `<span class="league-pill">${escapeHtml(leagueLabel)}</span>` : ""}
          </div>
          <div class="standings-table-wrap">
            <table class="standings-table">
              <thead><tr><th>Team / Driver</th>${cols.map(c => `<th>${escapeHtml(c.label)}</th>`).join("")}</tr></thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    async function fetchStandingsGroups(leaguePath, forceFresh = false) {
      if (!forceFresh && standingsCache.has(leaguePath)) return standingsCache.get(leaguePath);
      const res = await fetch(`https://site.api.espn.com/apis/v2/sports/${leaguePath}/standings`);
      const data = await res.json();
      const groups = extractStandingsGroups(data);
      standingsCache.set(leaguePath, groups);
      return groups;
    }

    function renderLeagueStandings(groups, leaguePath) {
      if (groups.length === 0) {
        contentEl.innerHTML = `<div class="empty">Standings are not available for this league right now.</div>`;
        return;
      }
      let filterHtml = "";
      if (groups.length > 3 && !searchQuery) {
        const options = [
          `<option value="all" ${selectedStandingsGroup === "all" ? "selected" : ""}>All Conferences / Groups (${groups.length})</option>`,
          ...groups.map((g, i) => `<option value="${i}" ${String(selectedStandingsGroup) === String(i) ? "selected" : ""}>${escapeHtml(g.title)}</option>`)
        ].join("");
        filterHtml = `<div class="standings-filter-bar"><select class="standings-select" id="standings-group-select">${options}</select></div>`;
      }
      const toRender = searchQuery || selectedStandingsGroup === "all" || groups.length <= 3
        ? groups : [groups[Number(selectedStandingsGroup)]].filter(Boolean);
      const cards = toRender.map(g => renderStandingsCard(g, leaguePath, false)).filter(Boolean);
      contentEl.innerHTML = cards.length ? (filterHtml + cards.join("")) : (filterHtml + `<div class="empty">No standings matched "${escapeHtml(searchQuery)}".</div>`);
    }

    async function loadStandings(silent = false) {
      if (!silent) contentEl.innerHTML = `<div class="empty">Loading standings...</div>`;
      try { renderLeagueStandings(await fetchStandingsGroups(currentLeague, silent), currentLeague); }
      catch { if (!silent) contentEl.innerHTML = `<div class="empty">Could not load standings right now. Try refreshing.</div>`; }
    }

    function renderCombinedStandingsList() {
      const cardsHtml = [];
      lastCombinedStandings.forEach(({ league, groups }) => {
        groups.forEach(group => {
          const hasPinned = (group.entries || []).some(entry => {
            const meta = getEntryMeta(entry);
            return isFavorited(league.path, meta.id, [meta.name, meta.fullName, meta.abbr]);
          });
          if (hasPinned) {
            const html = renderStandingsCard(group, league.path, true);
            if (html) cardsHtml.push(html);
          }
        });
      });
      contentEl.innerHTML = cardsHtml.length ? cardsHtml.join("") : `<div class="empty">${searchQuery ? `No pinned standings matched "${escapeHtml(searchQuery)}".` : "No standings tables matched your pinned teams right now."}</div>`;
    }

    async function loadCombinedStandings(silent = false) {
      const activeLeagues = getActiveFavLeagues();
      if (activeLeagues.length === 0) {
        lastCombinedStandings = [];
        contentEl.innerHTML = `<div class="empty">Pin a few teams or drivers first to see their conference and league tables here.</div>`;
        return;
      }
      if (!silent) contentEl.innerHTML = `<div class="empty">Loading standings for your pinned teams...</div>`;
      const results = await Promise.allSettled(activeLeagues.map(async league => ({ league, groups: await fetchStandingsGroups(league.path, silent) })));
      lastCombinedStandings = results.filter(r => r.status === "fulfilled").map(r => r.value);
      renderCombinedStandingsList();
    }

    /* ---------- IN-APP GAME RECAP READER ---------- */
    function renderRecapHtml(data) {
      const article = data.article;
      const storyHtml = sanitizeRecapHtml(article?.story || "");

      if (!article || (!storyHtml && !article.description)) {
        const state = data.header?.competitions?.[0]?.status?.type?.state || "";
        const msg = state === "post"
          ? "Game recap article has not been published yet. Try refreshing in a few minutes."
          : "The full game recap will appear here right after the game finishes.";
        return `<div class="empty" style="padding:18px 8px;">${msg}</div>`;
      }

      const heroImg = article.images?.[0]?.url || "";
      const byline = article.byline || article.source || "Game Recap";
      const timeStr = formatTimeAgo(article.published || article.lastModified);
      const metaLine = [byline, timeStr].filter(Boolean).join(" · ");

      return `
        <div class="recap-card">
          ${heroImg ? `<img class="recap-hero" src="${escapeHtml(heroImg)}" alt="" loading="lazy" />` : ""}
          <div class="recap-inner">
            <h3 class="recap-headline">${escapeHtml(article.headline || "Game Recap")}</h3>
            <div class="recap-meta">${escapeHtml(metaLine)}</div>
            <div class="recap-story">${storyHtml || `<p>${escapeHtml(article.description || "")}</p>`}</div>
          </div>
        </div>
      `;
    }

    /* ---------- FOOTBALL FIELD & DRIVE VISUALIZER ---------- */
    function renderFieldHtml(data) {
      const drives = data.drives || {};
      const activeDrive = drives.current || (drives.previous?.length ? drives.previous[drives.previous.length - 1] : null);
      if (!activeDrive) {
        return `<div class="empty" style="padding:16px 0;">Field & drive tracker will appear once the game begins.</div>`;
      }

      const headerComp = data.header?.competitions?.[0];
      const comps = headerComp?.competitors || [];
      const awayComp = comps.find(c => c.homeAway === "away") || comps[0];
      const homeComp = comps.find(c => c.homeAway === "home") || comps[1];

      const awayAbbr = awayComp?.team?.abbreviation || "AWAY";
      const homeAbbr = homeComp?.team?.abbreviation || "HOME";
      const awayColor = awayComp?.team?.color ? `#${awayComp.team.color}` : "#1d4ed8";
      const homeColor = homeComp?.team?.color ? `#${homeComp.team.color}` : "#b91c1c";

      const possTeam = activeDrive.team || {};
      const possAbbr = possTeam.abbreviation || "";
      const isAwayPoss = possAbbr && possAbbr === awayAbbr;

      const plays = activeDrive.plays || [];
      const lastPlay = plays[plays.length - 1] || {};
      const firstPlay = plays[0] || {};

      const endYardsToEZ = lastPlay.end?.yardsToEndzone ?? lastPlay.start?.yardsToEndzone ?? 50;
      const startYardsToEZ = firstPlay.start?.yardsToEndzone ?? endYardsToEZ;

      const ballFieldYard = isAwayPoss ? (100 - endYardsToEZ) : endYardsToEZ;
      const startFieldYard = isAwayPoss ? (100 - startYardsToEZ) : startYardsToEZ;

      const distance = lastPlay.end?.distance ?? lastPlay.start?.distance ?? 0;
      const firstDownYard = distance > 0
        ? (isAwayPoss ? Math.min(100, ballFieldYard + distance) : Math.max(0, ballFieldYard - distance))
        : null;

      const toSvgX = (yard) => 10 + Math.max(0, Math.min(100, yard));
      const ballX = toSvgX(ballFieldYard);
      const startX = toSvgX(startFieldYard);
      const trailX = Math.min(startX, ballX);
      const trailW = Math.abs(ballX - startX);
      const fdX = firstDownYard !== null ? toSvgX(firstDownYard) : null;

      const downDist = lastPlay.end?.shortDownDistanceText || lastPlay.start?.shortDownDistanceText || activeDrive.result || "";
      const yardText = lastPlay.end?.possessionText || lastPlay.start?.possessionText || "";
      const situationText = [downDist, yardText ? `@ ${yardText}` : ""].filter(Boolean).join(" ");
      const clockText = lastPlay.clock?.displayValue || "";
      const periodText = lastPlay.period?.number ? `Q${lastPlay.period.number}` : "";

      let stripesSvg = "";
      for (let i = 0; i < 10; i++) {
        const fill = i % 2 === 0 ? "#246b35" : "#2c7d3f";
        stripesSvg += `<rect x="${10 + i * 10}" y="4" width="10" height="38" fill="${fill}" />`;
        if (i > 0) stripesSvg += `<line x1="${10 + i * 10}" y1="4" x2="${10 + i * 10}" y2="42" stroke="rgba(255,255,255,0.22)" stroke-width="0.4" />`;
      }

      const driveDesc = activeDrive.description || (plays.length ? `${plays.length} plays` : "");
      const isCurrent = Boolean(drives.current);

      return `
        <div class="field-card">
          <div class="field-header">
            <span class="field-poss">
              <span class="field-poss-dot"></span>
              ${escapeHtml(possTeam.shortDisplayName || possTeam.displayName || possAbbr || "Drive")} ${isCurrent ? "Ball" : "Last Drive"}
            </span>
            <span class="field-situation">${escapeHtml(situationText)}</span>
          </div>
          <div class="field-svg-wrap">
            <svg viewBox="0 0 120 46" xmlns="http://www.w3.org/2000/svg">
              <rect x="0" y="4" width="10" height="38" fill="${escapeHtml(awayColor)}" />
              <rect x="110" y="4" width="10" height="38" fill="${escapeHtml(homeColor)}" />
              <text x="5" y="23" fill="rgba(255,255,255,0.85)" font-size="3.6" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 5 23)">${escapeHtml(awayAbbr)}</text>
              <text x="115" y="23" fill="rgba(255,255,255,0.85)" font-size="3.6" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(90 115 23)">${escapeHtml(homeAbbr)}</text>
              ${stripesSvg}
              <line x1="10" y1="4" x2="10" y2="42" stroke="#ffffff" stroke-width="0.6" />
              <line x1="110" y1="4" x2="110" y2="42" stroke="#ffffff" stroke-width="0.6" />
              ${trailW > 0.5 ? `<rect x="${trailX}" y="18" width="${trailW}" height="10" fill="rgba(10, 132, 255, 0.45)" rx="1.5" />` : ""}
              ${fdX !== null && isCurrent ? `<line x1="${fdX}" y1="4" x2="${fdX}" y2="42" stroke="#ffd60a" stroke-width="1" />` : ""}
              <line x1="${ballX}" y1="4" x2="${ballX}" y2="42" stroke="#0a84ff" stroke-width="0.9" />
              <circle cx="${ballX}" cy="23" r="3.4" fill="#ffffff" stroke="#0a84ff" stroke-width="1" />
              <ellipse cx="${ballX}" cy="23" rx="2" ry="1.2" fill="#8b4513" />
            </svg>
          </div>
          <div class="field-markers">
            <span>${escapeHtml(awayAbbr)}</span><span>20</span><span>50</span><span>20</span><span>${escapeHtml(homeAbbr)}</span>
          </div>
          ${lastPlay.text ? `
            <div class="last-play-box">
              <div class="last-play-meta">
                <span>Last Play</span>
                <span>${escapeHtml([periodText, clockText].filter(Boolean).join(" · "))}</span>
              </div>
              <div>${escapeHtml(lastPlay.text)}</div>
            </div>
          ` : ""}
          ${driveDesc ? `<div class="drive-summary-line">Drive: ${escapeHtml(driveDesc)}</div>` : ""}
        </div>
      `;
    }

    /* ---------- PLAYER STAT BREAKDOWNS (INSTANT DOM SWITCHING) ---------- */
    function renderTeamPaneContent(teamObj, showHeading = false) {
      const statGroups = (teamObj.statistics || []).filter(g => g.athletes && g.athletes.length > 0);
      const teamName = teamObj.team?.shortDisplayName || teamObj.team?.displayName || teamObj.team?.abbreviation || "Team";
      const heading = `<div class="player-team-heading" style="display:${showHeading ? "block" : "none"};">${escapeHtml(teamName)}</div>`;

      if (statGroups.length === 0) {
        return heading + `<div class="empty" style="padding:10px 0;">No player stats recorded yet.</div>`;
      }

      const groupsHtml = statGroups.map(group => {
        const headers = (group.labels && group.labels.length ? group.labels : group.names) || [];
        const maxCols = Math.min(headers.length, 6);
        const colHeaders = headers.slice(0, maxCols);

        const rowsHtml = group.athletes.slice(0, 14).map(a => {
          const name = a.athlete?.shortName || a.athlete?.displayName || "Player";
          const pos = a.athlete?.position?.abbreviation || "";
          const vals = (a.stats || []).slice(0, maxCols);
          return `
            <tr>
              <td>${escapeHtml(name)}${pos ? `<span class="player-pos">${escapeHtml(pos)}</span>` : ""}</td>
              ${vals.map(v => `<td>${escapeHtml(v)}</td>`).join("")}
            </tr>
          `;
        }).join("");

        return `
          <div class="player-cat-block">
            ${group.text || group.name ? `<div class="player-cat-title">${escapeHtml(group.text || group.name)}</div>` : ""}
            <div class="player-table-wrap">
              <table class="player-table">
                <thead>
                  <tr>
                    <th>Player</th>
                    ${colHeaders.map(h => `<th>${escapeHtml(h)}</th>`).join("")}
                  </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
              </table>
            </div>
          </div>
        `;
      }).join("");

      return heading + groupsHtml;
    }

    function renderPlayersHtml(data, activeSel = "0") {
      const playerTeams = data.boxscore?.players || [];
      if (playerTeams.length === 0) {
        return `<div class="empty" style="padding:14px 0;">Player stats are not available yet.</div>`;
      }

      const sel = String(activeSel || "0");
      const toggleHtml = `
        <div class="player-team-toggle">
          ${playerTeams.map((pt, idx) => `
            <button
              type="button"
              data-sel="${idx}"
              onclick="event.stopPropagation(); window.__switchPlayerTeam(this, '${idx}')"
              class="${sel === String(idx) ? "active" : ""}"
            >${escapeHtml(pt.team?.abbreviation || pt.team?.shortDisplayName || `Team ${idx + 1}`)}</button>
          `).join("")}
          <button
            type="button"
            data-sel="all"
            onclick="event.stopPropagation(); window.__switchPlayerTeam(this, 'all')"
            class="${sel === "all" ? "active" : ""}"
          >Both</button>
        </div>
      `;

      const panesHtml = playerTeams.map((pt, idx) => {
        const visible = sel === "all" || sel === String(idx);
        return `
          <div class="player-team-pane ${visible ? "visible" : ""}" data-pane-idx="${idx}">
            ${renderTeamPaneContent(pt, sel === "all")}
          </div>
        `;
      }).join("");

      return `<div class="players-root">${toggleHtml}${panesHtml}</div>`;
    }

    /* ---------- EXTRACT ALL GAME & PLAY-LEVEL VIDEO CLIPS ---------- */
    function extractAllGameVideos(data) {
      const seen = new Set();
      const clips = [];

      const addClip = (v, fallbackTitle = "") => {
        if (!v) return;
        const src = v.links?.source || {};
        const streamUrl = src.HD?.href || src.full?.href || src.mezzanine?.href || src.HLS?.HD?.href || src.HLS?.href || src.href || "";
        if (!streamUrl) return;
        const key = v.id ? String(v.id) : streamUrl;
        if (seen.has(key)) return;
        seen.add(key);
        clips.push({
          title: v.headline || v.title || v.description || fallbackTitle || "Highlight",
          thumbnail: v.thumbnail || "",
          streamUrl
        });
      };

      (data.videos || []).forEach(v => addClip(v));

      const playLists = [
        data.scoringPlays || [],
        data.keyEvents || [],
        data.plays || [],
        data.drives?.current?.plays || [],
        ...(data.drives?.previous || []).map(d => d.plays || [])
      ];

      playLists.forEach(list => {
        list.forEach(play => {
          const playTitle = play.text || play.shortText || "";
          if (Array.isArray(play.videos)) play.videos.forEach(v => addClip(v, playTitle));
          if (Array.isArray(play.media)) play.media.forEach(v => addClip(v, playTitle));
        });
      });

      return clips;
    }

    function hydrateYouTubeSlot(drawerEl, data, leaguePath) {
      const slot = drawerEl.querySelector(".yt-auto-slot");
      if (!slot) return;
      const comps = data.header?.competitions?.[0]?.competitors || [];
      const awayTeam = comps.find(c => c.homeAway === "away")?.team || comps[0]?.team || {};
      const homeTeam = comps.find(c => c.homeAway === "home")?.team || comps[1]?.team || {};
      const keywords = [
        awayTeam.shortDisplayName, awayTeam.name, awayTeam.location,
        homeTeam.shortDisplayName, homeTeam.name, homeTeam.location
      ].filter(Boolean);
      loadYouTubeMatchesIntoSlot(slot, leaguePath, keywords);
    }

    /* ---------- HIGHLIGHTS: X FIRST -> ESPN DIRECT CLIPS -> YOUTUBE AUTO-EMBEDS ---------- */
    function renderHighlightsHtml(data, leaguePath) {
      const headerComp = data.header?.competitions?.[0];
      const comps = headerComp?.competitors || [];
      const awayTeam = comps.find(c => c.homeAway === "away")?.team || comps[0]?.team || {};
      const homeTeam = comps.find(c => c.homeAway === "home")?.team || comps[1]?.team || {};

      const awayName = awayTeam.shortDisplayName || awayTeam.abbreviation || "Away";
      const homeName = homeTeam.shortDisplayName || homeTeam.abbreviation || "Home";
      const awayHandle = guessXHandle(awayTeam, leaguePath);
      const homeHandle = guessXHandle(homeTeam, leaguePath);

      const awayXUrl = `https://x.com/search?q=${encodeURIComponent(awayName + " highlights")}&f=video`;
      const homeXUrl = `https://x.com/search?q=${encodeURIComponent(homeName + " highlights")}&f=video`;
      const ytUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(awayName + " vs " + homeName + " highlights")}`;

      const clips = extractAllGameVideos(data);
      const directClipsHtml = clips.map(c => `
        <div class="video-card">
          <video controls playsinline webkit-playsinline preload="none" poster="${escapeHtml(c.thumbnail)}" src="${escapeHtml(c.streamUrl)}"></video>
          <div class="video-title">${escapeHtml(c.title)}</div>
        </div>
      `).join("");

      return `
        <div class="x-section-title">1. Team X Feeds (In-App)</div>
