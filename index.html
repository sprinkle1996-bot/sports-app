          <button type="button" class="x-action-btn x-primary" onclick="event.stopPropagation(); window.__loadXTimeline(this, '${escapeHtml(awayHandle)}')">𝕏 @${escapeHtml(awayHandle)}</button>
          <button type="button" class="x-action-btn x-primary" onclick="event.stopPropagation(); window.__loadXTimeline(this, '${escapeHtml(homeHandle)}')">𝕏 @${escapeHtml(homeHandle)}</button>
          <a class="x-action-btn" href="${awayXUrl}" target="_blank" rel="noopener noreferrer">𝕏 ${escapeHtml(awayName)} Videos</a>
          <a class="x-action-btn" href="${homeXUrl}" target="_blank" rel="noopener noreferrer">𝕏 ${escapeHtml(homeName)} Videos</a>
        </div>
        <div class="x-embed-slot"></div>

        ${directClipsHtml ? `<div class="x-section-title">2. ESPN Direct In-App Clips (${clips.length})</div>${directClipsHtml}` : ""}

        <div class="x-section-title">${directClipsHtml ? "3." : "2."} Broadcaster & League Highlights (In-App)</div>
        <div class="yt-auto-slot"><div class="yt-status-note">Checking official broadcaster & league YouTube feeds...</div></div>

        <div class="x-section-title">More Highlights</div>
        <div class="x-btn-grid">
          <a class="x-action-btn yt-btn" href="${ytUrl}" target="_blank" rel="noopener noreferrer">▶ Search YouTube: ${escapeHtml(awayName)} vs ${escapeHtml(homeName)}</a>
        </div>
      `;
    }

    /* ---------- BOX SCORE DRAWER ---------- */
    function renderBoxScoreHtml(data, leaguePath, activeSubtab = "stats", activePlayerTeam = "0") {
      const isFootball = leaguePath === "football/nfl" || leaguePath === "football/college-football";
      const teams = data.boxscore?.teams || [];
      const awayTeam = teams[0];
      const homeTeam = teams[1];

      let body = "";

      if (activeSubtab === "field" && isFootball) {
        body = renderFieldHtml(data);
      } else if (activeSubtab === "recap") {
        body = renderRecapHtml(data);
      } else if (activeSubtab === "players") {
        body = renderPlayersHtml(data, activePlayerTeam);
      } else if (activeSubtab === "highlights") {
        body = renderHighlightsHtml(data, leaguePath);
      } else if (activeSubtab === "stats") {
        if (awayTeam && homeTeam && awayTeam.statistics?.length) {
          const homeStatMap = Object.fromEntries((homeTeam.statistics || []).map(s => [s.name || s.label, s.displayValue]));
          const rows = awayTeam.statistics.slice(0, 12).map(s => `
            <tr>
              <td>${escapeHtml(s.displayValue)}</td>
              <td>${escapeHtml(s.label || s.name)}</td>
              <td>${escapeHtml(homeStatMap[s.name || s.label] ?? "-")}</td>
            </tr>
          `).join("");
          body = `
            <table class="stat-table">
              <thead><tr><th>${escapeHtml(awayTeam.team?.abbreviation || "Away")}</th><th>Stat</th><th>${escapeHtml(homeTeam.team?.abbreviation || "Home")}</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          `;
        } else {
          body = `<div class="empty" style="padding:14px 0;">Team stats not available yet.</div>`;
        }
      } else {
        const rawPlays = data.scoringPlays?.length ? data.scoringPlays : (data.keyEvents?.length ? data.keyEvents : (data.plays || []));
        if (rawPlays.length > 0) {
          const recent = rawPlays.slice(-10).reverse();
          body = recent.map(p => {
            const period = p.period?.displayValue || (p.period?.number ? `P${p.period.number}` : "");
            const clock = p.clock?.displayValue || "";
            const scoreLine = (p.awayScore !== undefined && p.homeScore !== undefined) ? ` · ${p.awayScore}-${p.homeScore}` : "";
            return `
              <div class="play-item">
                <div class="play-clock">${escapeHtml([period, clock].filter(Boolean).join(" "))}${escapeHtml(scoreLine)}</div>
                <div>${escapeHtml(p.text || p.shortText || p.type?.text || "")}</div>
              </div>
            `;
          }).join("");
        } else {
          body = `<div class="empty" style="padding:14px 0;">Play-by-play not available yet.</div>`;
        }
      }

      return `
        <div class="box-subtabs">
          ${isFootball ? `<button type="button" onclick="event.stopPropagation(); window.__switchBoxTab(this, 'field')" class="${activeSubtab === "field" ? "active" : ""}">Field</button>` : ""}
          <button type="button" onclick="event.stopPropagation(); window.__switchBoxTab(this, 'recap')" class="${activeSubtab === "recap" ? "active" : ""}">Recap</button>
          <button type="button" onclick="event.stopPropagation(); window.__switchBoxTab(this, 'players')" class="${activeSubtab === "players" ? "active" : ""}">Players</button>
          <button type="button" onclick="event.stopPropagation(); window.__switchBoxTab(this, 'stats')" class="${activeSubtab === "stats" ? "active" : ""}">Team</button>
          <button type="button" onclick="event.stopPropagation(); window.__switchBoxTab(this, 'plays')" class="${activeSubtab === "plays" ? "active" : ""}">Plays</button>
          <button type="button" onclick="event.stopPropagation(); window.__switchBoxTab(this, 'highlights')" class="${activeSubtab === "highlights" ? "active" : ""}">𝕏 Clips</button>
        </div>
        <div class="box-body">${body}</div>
      `;
    }

    async function fetchSummary(leaguePath, eventId) {
      const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${leaguePath}/summary?event=${eventId}`);
      const data = await res.json();
      summaryCache.set(`${leaguePath}:${eventId}`, data);
      return data;
    }

    async function toggleBoxScore(cardEl) {
      const drawer = cardEl.querySelector(".box-drawer");
      if (!drawer) return;
      const leaguePath = cardEl.dataset.league;
      const eventId = cardEl.dataset.eventId;
      const cacheKey = `${leaguePath}:${eventId}`;

      if (drawer.classList.contains("open")) {
        drawer.classList.remove("open");
        openDrawers.delete(cacheKey);
        return;
      }

      drawer.classList.add("open");
      const isFootball = leaguePath === "football/nfl" || leaguePath === "football/college-football";
      const isFinal = cardEl.dataset.state === "post";
      const defaultTab = isFinal ? "recap" : (isFootball ? "field" : "players");

      const existing = openDrawers.get(cacheKey) || { tab: defaultTab, playerTeam: "0" };
      openDrawers.set(cacheKey, existing);
      cardEl.dataset.boxTab = existing.tab;

      if (summaryCache.has(cacheKey)) {
        const data = summaryCache.get(cacheKey);
        drawer.innerHTML = renderBoxScoreHtml(data, leaguePath, existing.tab, existing.playerTeam);
        if (existing.tab === "highlights") hydrateYouTubeSlot(drawer, data, leaguePath);
        return;
      }

      drawer.innerHTML = `<div class="empty" style="padding:14px 0;">Loading game details...</div>`;
      try {
        const data = await fetchSummary(leaguePath, eventId);
        drawer.innerHTML = renderBoxScoreHtml(data, leaguePath, existing.tab, existing.playerTeam);
        if (existing.tab === "highlights") hydrateYouTubeSlot(drawer, data, leaguePath);
      } catch {
        drawer.innerHTML = `<div class="empty" style="padding:14px 0;">Could not load game details.</div>`;
      }
    }

    /* ---------- SCOREBOARD CARDS ---------- */
    function renderTeamCard(event, leaguePath, showLeaguePill = false) {
      const comp = event.competitions?.[0];
      const competitors = comp?.competitors || [];
      const away = competitors.find(c => c.homeAway === "away") || competitors[0];
      const home = competitors.find(c => c.homeAway === "home") || competitors[1];

      if (searchQuery) {
        const blob = [
          event.name,
          away?.team?.displayName, away?.team?.shortDisplayName, away?.team?.abbreviation,
          home?.team?.displayName, home?.team?.shortDisplayName, home?.team?.abbreviation
        ].filter(Boolean).join(" ");
        if (!matchesSearch(blob)) return { isPinned: false, state: "post", html: "" };
      }

      const awayFav = away && isFavorited(leaguePath, away.team?.id, [
        away.team?.shortDisplayName, away.team?.displayName, away.team?.abbreviation
      ]);
      const homeFav = home && isFavorited(leaguePath, home.team?.id, [
        home.team?.shortDisplayName, home.team?.displayName, home.team?.abbreviation
      ]);
      const isPinned = Boolean(awayFav || homeFav);

      const state = event.status?.type?.state || "post";
      const statusText = event.status?.type?.shortDetail || "";
      const isLive = state === "in";
      const isFinal = state === "post";
      const isFootball = leaguePath === "football/nfl" || leaguePath === "football/college-football";
      const possTeamId = (isLive && isFootball && comp?.situation?.possession) ? String(comp.situation.possession) : "";

      const leagueLabel = leagueMap[leaguePath]?.label || "";
      const watchHtml = renderWatchPills(comp);
      const redditHtml = renderRedditPills(
        leaguePath,
        away?.team?.shortDisplayName || away?.team?.abbreviation || "",
        home?.team?.shortDisplayName || home?.team?.abbreviation || ""
      );
      const oddsHtml = renderOddsStrip(comp, state, away, home);

      const cacheKey = `${leaguePath}:${event.id}`;
      const openState = openDrawers.get(cacheKey);
      const drawerOpenClass = openState ? "open" : "";
      const drawerInnerHtml = (openState && summaryCache.has(cacheKey))
        ? renderBoxScoreHtml(summaryCache.get(cacheKey), leaguePath, openState.tab, openState.playerTeam)
        : "";

      const renderTeam = (c, starred) => {
        const rankNum = c?.curatedRank?.current;
        const rankHtml = rankNum && rankNum <= 25 ? `<span class="rank">${rankNum}</span>` : "";
        const teamId = c?.team?.id || "";
        const shortName = c?.team?.shortDisplayName || "TBD";
        const fullName = c?.team?.displayName || shortName;
        const isLoser = isFinal && c?.winner === false;
        const hasPoss = possTeamId && teamId && String(teamId) === possTeamId;
        return `
          <div class="team-row ${isLoser ? "loser" : ""}">
            <div class="team-info">
              <button
                type="button"
                class="star-btn ${starred ? "starred" : ""}"
                data-league="${leaguePath}"
                data-fav-id="${escapeHtml(teamId)}"
                data-fav-name="${escapeHtml(shortName)}"
                data-fav-full="${escapeHtml(fullName)}"
                aria-label="Pin ${escapeHtml(shortName)}"
              >${starred ? "★" : "☆"}</button>
              <img src="${c?.team?.logo || ""}" alt="" />
              ${rankHtml}
              <span class="team-name">${escapeHtml(shortName)}</span>
              ${hasPoss ? `<span class="poss-ball" title="Possession">🏈</span>` : ""}
              <span class="record">${escapeHtml(c?.records?.[0]?.summary || "")}</span>
            </div>
            <div class="score">${escapeHtml(c?.score ?? "-")}</div>
          </div>
        `;
      };

      return {
        isPinned,
        state,
        html: `
          <div class="game-card clickable ${isPinned ? "pinned" : ""}" data-event-id="${escapeHtml(event.id)}" data-league="${leaguePath}" data-state="${state}" data-box-tab="${escapeHtml(openState?.tab || "")}">
            <div class="status-row">
              <div class="status-left">
                ${showLeaguePill ? `<span class="league-pill">${leagueLabel}</span>` : ""}
                <div class="status ${isLive ? "live" : ""}">${isLive ? "● " : ""}${escapeHtml(statusText)}</div>
              </div>
              ${isPinned && !showLeaguePill ? `<span class="pinned-badge">★ PINNED</span>` : ""}
            </div>
            ${renderTeam(away, awayFav)}
            ${renderTeam(home, homeFav)}
            ${oddsHtml}
            <div class="card-footer">
              <div class="watch-list">${watchHtml}${redditHtml}</div>
              <div class="tap-hint">${isFinal ? "Recap & Stats ▾" : "Details ▾"}</div>
            </div>
            <div class="box-drawer ${drawerOpenClass}">${drawerInnerHtml}</div>
          </div>
        `
      };
    }

    function renderLeaderboardCard(event, leaguePath, onlyPinned = false) {
      const isF1 = leaguePath === "racing/f1";
      const maxRows = isF1 ? 10 : 15;
      const leagueLabel = leagueMap[leaguePath]?.label || "";
      const comps = event.competitions || [];
      const comp = isF1 ? (comps.find(c => c.type?.abbreviation === "Race") || comps[comps.length - 1]) : comps[0];

      const state = comp?.status?.type?.state || event.status?.type?.state || "post";
      const statusText = comp?.status?.type?.shortDetail || event.status?.type?.shortDetail || "";
      const isLive = state === "in";
      const watchHtml = renderWatchPills(comp);
      const redditHtml = renderRedditPills(leaguePath, "", "", event.shortName || event.name || "");
      const allSorted = (comp?.competitors || []).slice().sort((a, b) => (a.order ?? a.sortOrder ?? 999) - (b.order ?? b.sortOrder ?? 999));

      const eventMatches = matchesSearch(event.name || event.shortName || "");
      const pinnedItems = [];
      const regularItems = [];

      allSorted.forEach((c, idx) => {
        const id = c.athlete?.id || "";
        const name = c.athlete?.displayName || c.athlete?.shortName || "TBD";
        const starred = isFavorited(leaguePath, id, [name, c.athlete?.shortName]);
        if (searchQuery && !eventMatches && !matchesSearch(name)) return;
        const item = { c, idx, id, name, starred };
        if (starred) pinnedItems.push(item);
        else if (!onlyPinned && (searchQuery || regularItems.length < maxRows)) regularItems.push(item);
      });

      if (onlyPinned && pinnedItems.length === 0) return { isPinned: false, state, html: "" };
      if (searchQuery && pinnedItems.length === 0 && regularItems.length === 0) return { isPinned: false, state, html: "" };

      const displayList = onlyPinned ? pinnedItems : [...pinnedItems, ...regularItems];
      const rowsHtml = displayList.length > 0
        ? displayList.map(({ c, idx, id, name, starred }) => {
            const pos = c.status?.position?.displayName || (idx + 1);
            const score = typeof c.score === "object" ? (c.score?.displayValue || "") : (c.score ?? "");
            return `
              <div class="leader-row ${starred ? "pinned-leader" : ""}">
                <div class="team-info">
                  <button type="button" class="star-btn ${starred ? "starred" : ""}" data-league="${leaguePath}" data-fav-id="${escapeHtml(id)}" data-fav-name="${escapeHtml(name)}" data-fav-full="${escapeHtml(name)}" aria-label="Pin ${escapeHtml(name)}">${starred ? "★" : "☆"}</button>
                  <span class="pos">${escapeHtml(pos)}</span>
                  <span class="team-name" style="font-size:0.92rem;">${escapeHtml(name)}</span>
                </div>
                <div class="score" style="font-size:0.95rem;">${escapeHtml(score)}</div>
              </div>
            `;
          }).join("")
        : `<div class="empty" style="padding:12px 0;">Leaderboard not posted yet.</div>`;

      return {
        isPinned: pinnedItems.length > 0,
        state,
        html: `
          <div class="game-card ${pinnedItems.length > 0 ? "pinned" : ""}">
            <div class="event-title">${escapeHtml(event.name || event.shortName || "Event")}</div>
            <div class="status-row">
              <div class="status-left">
                ${onlyPinned ? `<span class="league-pill">${leagueLabel}</span>` : ""}
                <div class="status ${isLive ? "live" : ""}">${isLive ? "● " : ""}${escapeHtml(statusText)}</div>
              </div>
              ${pinnedItems.length > 0 && !onlyPinned ? `<span class="pinned-badge">★ ${pinnedItems.length} PINNED</span>` : ""}
            </div>
            ${rowsHtml}
            ${(watchHtml || redditHtml) ? `<div class="card-footer"><div class="watch-list">${watchHtml}${redditHtml}</div></div>` : ""}
          </div>
        `
      };
    }

    function hydrateAllOpenYouTubeSlots() {
      contentEl.querySelectorAll(".game-card").forEach(cardEl => {
        if (cardEl.dataset.boxTab !== "highlights") return;
        const drawer = cardEl.querySelector(".box-drawer.open");
        const cacheKey = `${cardEl.dataset.league}:${cardEl.dataset.eventId}`;
        if (drawer && summaryCache.has(cacheKey)) {
          hydrateYouTubeSlot(drawer, summaryCache.get(cacheKey), cardEl.dataset.league);
        }
      });
    }

    function getEmptyStatusMessage() {
      if (statusFilter === "live") return "No games are currently live right now.";
      if (statusFilter === "final") return "No finished games for this date yet.";
      return searchQuery ? `No games matched "${escapeHtml(searchQuery)}".` : "No events scheduled for this date.";
    }

    function renderCurrentScoreboard() {
      const league = leagueMap[currentLeague];
      let eventsToShow = lastEvents;
      if (league?.allLabel && collegeFilter === "top25") eventsToShow = lastEvents.filter(isTop25Event);

      if (eventsToShow.length === 0) {
        updateStatusCounts([]);
        contentEl.innerHTML = `<div class="empty">No events scheduled for this date.</div>`;
        return;
      }

      if (league.type === "leaderboard") {
        const allCards = eventsToShow.map(ev => renderLeaderboardCard(ev, currentLeague, false)).filter(c => c.html);
        updateStatusCounts(allCards);
        const filtered = filterCardsByStatus(allCards);
        contentEl.innerHTML = filtered.length
          ? filtered.map(c => c.html).join("")
          : `<div class="empty">${getEmptyStatusMessage()}</div>`;
        return;
      }

      const allCards = eventsToShow.map((ev, idx) => ({ ...renderTeamCard(ev, currentLeague, false), idx })).filter(c => c.html);
      updateStatusCounts(allCards);
      const filtered = filterCardsByStatus(allCards);

      if (filtered.length === 0) {
        contentEl.innerHTML = `<div class="empty">${getEmptyStatusMessage()}</div>`;
        return;
      }

      filtered.sort((a, b) => Number(b.isPinned) - Number(a.isPinned) || getStatePriority(a.state) - getStatePriority(b.state) || a.idx - b.idx);
      contentEl.innerHTML = filtered.map(c => c.html).join("");
      hydrateAllOpenYouTubeSlots();
    }

    function renderCombinedScoreboard() {
      const activeLeagues = getActiveFavLeagues();
      if (activeLeagues.length === 0) {
        updateStatusCounts([]);
        contentEl.innerHTML = `<div class="empty">No teams or players pinned yet.<br/>Switch to any league and tap <strong>☆</strong>, or tap <strong>★ Pins</strong> above.</div>`;
        return;
      }

      const matchedCards = [];
      const quietLeagues = [];

      lastCombinedData.forEach(({ league, events }) => {
        if (getLeagueFavs(league.path).length === 0) return;
        let foundInLeague = false;
        events.forEach(ev => {
          const card = league.type === "leaderboard" ? renderLeaderboardCard(ev, league.path, true) : renderTeamCard(ev, league.path, true);
          if (card.isPinned && card.html) {
            matchedCards.push(card);
            foundInLeague = true;
          }
        });
        if (!foundInLeague) quietLeagues.push(league.label);
      });

      updateStatusCounts(matchedCards);
      const filtered = filterCardsByStatus(matchedCards);
      filtered.sort((a, b) => getStatePriority(a.state) - getStatePriority(b.state));

      if (filtered.length === 0) {
        const msg = statusFilter === "live"
          ? "None of your pinned teams are currently live."
          : statusFilter === "final"
            ? "None of your pinned teams have finished yet on this date."
            : searchQuery
              ? `No pinned games matched "${escapeHtml(searchQuery)}".`
              : "None of your pinned teams or players have an event on this date.";
        contentEl.innerHTML = `<div class="empty">${msg}</div>`;
        return;
      }

      const quietHtml = !searchQuery && statusFilter === "all" && quietLeagues.length > 0
        ? `<div class="quiet-note">No games on this date for your pins in: ${quietLeagues.join(", ")}</div>` : "";
      contentEl.innerHTML = filtered.map(c => c.html).join("") + quietHtml;
      hydrateAllOpenYouTubeSlots();
    }

    async function refreshOpenDrawerSummaries() {
      if (openDrawers.size === 0) return;
      const tasks = Array.from(openDrawers.keys()).map(key => {
        const [leaguePath, eventId] = key.split(":");
        return fetchSummary(leaguePath, eventId).catch(() => null);
      });
      await Promise.allSettled(tasks);
    }

    async function loadScores(silent = false) {
      const league = leagueMap[currentLeague];
      if (!silent) contentEl.innerHTML = `<div class="empty">Loading scores...</div>`;
      try {
        const [res] = await Promise.all([
          fetch(getScoreboardUrl(league)),
          silent ? refreshOpenDrawerSummaries() : Promise.resolve()
        ]);
        const data = await res.json();
        lastEvents = data.events || [];
        renderCurrentScoreboard();
      } catch {
        if (!silent) contentEl.innerHTML = `<div class="empty">Could not load scores. Try refreshing.</div>`;
      }
    }

    async function loadCombinedScores(silent = false) {
      const activeLeagues = getActiveFavLeagues();
      if (activeLeagues.length === 0) {
        lastCombinedData = [];
        renderCombinedScoreboard();
        return;
      }
      if (!silent) contentEl.innerHTML = `<div class="empty">Loading your pinned teams...</div>`;
      const [results] = await Promise.all([
        Promise.allSettled(
          activeLeagues.map(async league => {
            const res = await fetch(getScoreboardUrl(league));
            const data = await res.json();
            return { league, events: data.events || [] };
          })
        ),
        silent ? refreshOpenDrawerSummaries() : Promise.resolve()
      ]);
      lastCombinedData = results.filter(r => r.status === "fulfilled").map(r => r.value);
      renderCombinedScoreboard();
    }

    /* ---------- MULTI-SOURCE RSS NEWS ---------- */
    async function fetchRssFeed(feed, leagueLabel) {
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`;
      const res = await fetch(apiUrl);
      const data = await res.json();
      if (data.status !== "ok" || !Array.isArray(data.items)) return [];

      return data.items
        .map(item => ({
          title: stripHtml(item.title),
          description: stripHtml(item.description).slice(0, 180),
          link: item.link,
          pubDate: item.pubDate,
          image: item.thumbnail || item.enclosure?.link || "",
          source: feed.source,
          leagueLabel
        }))
        .filter(item => !isGamblingAd(item));
    }

    function renderNewsCard(article, showLeaguePill = false) {
      const timeAgo = formatTimeAgo(article.pubDate);
      return `
        <a class="news-card" href="${escapeHtml(article.link || "#")}" target="_blank" rel="noopener noreferrer">
          ${article.image ? `<img src="${escapeHtml(article.image)}" alt="" loading="lazy" />` : ""}
          <div class="news-body">
            <div class="news-headline">${escapeHtml(article.title || "Untitled")}</div>
            ${article.description ? `<p class="news-desc">${escapeHtml(article.description)}</p>` : ""}
            <div class="news-meta">
              <span class="source-pill">${escapeHtml(article.source)}</span>
              ${showLeaguePill && article.leagueLabel ? `<span class="league-pill">${escapeHtml(article.leagueLabel)}</span>` : ""}
              <span>${escapeHtml(timeAgo)}</span>
            </div>
          </div>
        </a>
      `;
    }

    function renderNewsList(showLeaguePill) {
      const filtered = searchQuery
        ? lastNewsArticles.filter(a => matchesSearch(`${a.title} ${a.description} ${a.source} ${a.leagueLabel}`))
        : lastNewsArticles;
      contentEl.innerHTML = filtered.length
        ? filtered.slice(0, 30).map(a => renderNewsCard(a, showLeaguePill)).join("")
        : `<div class="empty">${searchQuery ? `No headlines matched "${escapeHtml(searchQuery)}".` : "No clean news stories available right now."}</div>`;
    }

    async function loadNews(silent = false) {
      const league = leagueMap[currentLeague];
      if (!silent) contentEl.innerHTML = `<div class="empty">Loading news...</div>`;
      const results = await Promise.allSettled((league.rss || []).map(feed => fetchRssFeed(feed, league.label)));
      const seen = new Set();
      const articles = [];
      results.forEach(r => {
        if (r.status !== "fulfilled") return;
        r.value.forEach(item => {
          const key = item.link || item.title;
          if (!seen.has(key)) { seen.add(key); articles.push(item); }
        });
      });
      articles.sort((a, b) => new Date(b.pubDate || 0) - new Date(a.pubDate || 0));
      lastNewsArticles = articles;
      renderNewsList(false);
    }

    async function loadCombinedNews(silent = false) {
      const activeLeagues = getActiveFavLeagues();
      if (activeLeagues.length === 0) {
        lastNewsArticles = [];
        contentEl.innerHTML = `<div class="empty">Pin a few teams or players first to see a combined news feed here.</div>`;
        return;
      }
      if (!silent) contentEl.innerHTML = `<div class="empty">Loading news for your pinned teams...</div>`;
      const jobs = [];
      activeLeagues.forEach(league => {
        (league.rss || []).forEach(feed => jobs.push(fetchRssFeed(feed, league.label).then(items => ({ league, items }))));
      });
      const results = await Promise.allSettled(jobs);
      const seen = new Set();
      const matched = [];
      results.forEach(r => {
        if (r.status !== "fulfilled") return;
        const { league, items } = r.value;
        const favs = getLeagueFavs(league.path);
        items.forEach(item => {
          const key = item.link || item.title;
          if (seen.has(key)) return;
          const textBlob = `${item.title} ${item.description}`.toLowerCase();
          if (favs.some(fav => fav.name && textBlob.includes(fav.name.trim().toLowerCase()))) {
            seen.add(key);
            matched.push(item);
          }
        });
      });
      matched.sort((a, b) => new Date(b.pubDate || 0) - new Date(a.pubDate || 0));
      lastNewsArticles = matched;
      renderNewsList(true);
    }

    function applySearchToCurrentView() {
      if (currentView === "scores") {
        if (currentLeague === "my-teams") renderCombinedScoreboard();
        else renderCurrentScoreboard();
      } else if (currentView === "standings") {
        if (currentLeague === "my-teams") renderCombinedStandingsList();
        else {
          const cached = standingsCache.get(currentLeague);
          if (cached) renderLeagueStandings(cached, currentLeague);
        }
      } else {
        renderNewsList(currentLeague === "my-teams");
      }
    }

    async function loadCurrentView(silent = false) {
      renderFavChips();
      updateDateUI();
      updateCollegeFilterUI();
      if (currentLeague === "my-teams") {
        if (currentView === "scores") await loadCombinedScores(silent);
        else if (currentView === "standings") await loadCombinedStandings(silent);
        else await loadCombinedNews(silent);
      } else {
        if (currentView === "scores") await loadScores(silent);
        else if (currentView === "standings") await loadStandings(silent);
        else await loadNews(silent);
      }
    }

    buildNavigation();

    setInterval(() => {
      if (currentView === "scores" && dateMode === "today") {
        if (currentLeague === "my-teams") loadCombinedScores(true);
        else loadScores(true);
      }
    }, 60000);
  </script>
